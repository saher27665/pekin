<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Search | PEKIN-PAK</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
    --glass-bg: rgba(255, 255, 255, 0.95);
    --glass-border: rgba(255, 255, 255, 0.4);
    --gold: #C9A959;
    --gold-bright: #E0C878;
    --green-dark: #0B2B1B;
    --green-light: #1A4D32;
    --text-dark: #1A1F1C;
    --text-muted: #5A6B60;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    min-height: 100dvh; 
    overflow-x: hidden;
    color: var(--text-dark);
    background: #e0e5df;
    display: flex;
    flex-direction: column;
}

/* ================= BACKGROUND & PETALS ================= */
.scenery-bg {
    position: fixed;
    inset: 0;
    background-image: url('back.png'); 
    background-size: cover;
    background-position: center;
    z-index: -3;
    animation: slowZoom 30s ease-in-out infinite alternate;
}

@keyframes slowZoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
}

.scenery-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(11, 43, 27, 0.85) 0%, rgba(26, 77, 50, 0.6) 50%, rgba(201, 169, 89, 0.3) 100%);
    z-index: -2;
    backdrop-filter: blur(8px) saturate(1.2);
}

.petals-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.petal {
    position: absolute;
    background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(201,169,89,0.4));
    border-radius: 50% 50% 50% 0;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
    animation: floatPetal linear infinite;
    opacity: 0.7;
}

@keyframes floatPetal {
    0% { transform: translateY(-100px) rotate(0deg) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(105vh) rotate(720deg) translateX(100px); opacity: 0; }
}

/* ================= PREMIUM LOADER ================= */
.loader-screen {
    position: fixed;
    inset: 0;
    background-color: var(--green-dark);
    background-image: url('need.png');
    background-size: cover;
    background-position: center;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease, visibility 1s;
    opacity: 0;
    visibility: hidden;
}

.loader-screen.active {
    opacity: 1;
    visibility: visible;
}

.loader-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(11, 43, 27, 0.7);
    z-index: 1;
}

.tick-loader {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
    z-index: 2;
}

.tick-loader::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px dashed rgba(40, 167, 69, 0.9);
    animation: spin 10s linear infinite;
}

.tick-loader::after {
    content: '';
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    border: 3px dashed rgba(201, 169, 89, 0.9);
    animation: spinReverse 10s linear infinite;
}

.tick-icon {
    width: 80px;
    height: 80px;
    background: rgba(11, 43, 27, 0.8);
    border: 2px solid #28A745;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: #28A745;
    box-shadow: 0 0 40px rgba(40, 167, 69, 0.8);
    animation: pulseTick 1.5s ease-in-out infinite;
    z-index: 2;
}

@keyframes pulseTick {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(40, 167, 69, 0.6); }
    50% { transform: scale(1.1); box-shadow: 0 0 60px rgba(40, 167, 69, 1); }
}
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes spinReverse { 100% { transform: rotate(-360deg); } }

.loader-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 10px;
    z-index: 2;
}

.loader-sub {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.8);
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 2;
}

/* ================= MAIN CONTAINER ================= */
.main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 2;
    width: 100%;
}

/* ================= SEARCH CARD ================= */
.search-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 45px 35px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.search-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright), var(--gold));
}

.search-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--green-dark);
    margin-bottom: 8px;
}

.search-card .subtitle {
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--gold-dark);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 30px;
}

.seal-icon {
    width: 70px; height: 70px;
    margin: 0 auto 15px;
    background: linear-gradient(135deg, rgba(11,43,27,1), rgba(26,77,50,1));
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; color: var(--gold);
    position: relative;
    box-shadow: 0 10px 20px rgba(11,43,27,0.3);
}
.seal-icon::after {
    content: '';
    position: absolute; inset: -6px; border-radius: 50%;
    border: 1px dashed var(--gold); animation: spin 15s linear infinite;
}

.input-group { position: relative; margin-bottom: 20px; }
.input-group i {
    position: absolute; left: 18px; top: 50%;
    transform: translateY(-50%); color: var(--gold-dark); font-size: 1.1rem;
}
.input-group input {
    width: 100%;
    padding: 18px 18px 18px 50px;
    background: #fff;
    border: 2px solid rgba(11,43,27,0.1);
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-weight: 700; font-size: 1.1rem; letter-spacing: 1.5px;
    outline: none; transition: 0.3s; color: var(--green-dark); text-transform: uppercase;
}
.input-group input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,169,89,0.15); }

.btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}

.btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: var(--green-dark); box-shadow: 0 10px 20px rgba(201,169,89,0.3);
}
.btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(201,169,89,0.5); }
.btn-gold:disabled { opacity: 0.7; cursor: not-allowed; }

.message-box {
    display: none; padding: 14px; border-radius: 10px;
    font-size: 0.85rem; margin-bottom: 20px; font-weight: 600; text-align: left;
}
.message-box.error { background: rgba(220,53,69,0.1); color: #721c24; border: 1px solid rgba(220,53,69,0.3); }

/* ================= NEW UNIQUE VIEWER ================= */
.viewer-wrapper {
    display: none;
    width: 100%;
    max-width: 1000px;
    flex-direction: column;
    gap: 16px;
    animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* New Unique Header (Dark Navy/Green with Gold) */
.top-header {
    background: rgba(11, 43, 27, 0.95);
    border: 1px solid rgba(201, 169, 89, 0.4);
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.brand-logos {
    display: flex;
    align-items: center;
    gap: 15px;
}
.brand-logos img { height: 40px; object-fit: contain; }
.brand-logos h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: #fff;
    line-height: 1.1;
}
.brand-logos p {
    font-size: 0.6rem;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
}

/* Floating Document Card */
.doc-window {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
}

/* Info Bar inside the window */
.doc-info-bar {
    background: #F9F7F2;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
    gap: 10px;
}

.doc-info-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--green-dark);
}
.doc-info-left i { color: #DC3545; font-size: 1.2rem; }

.doc-badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.badge {
    font-size: 0.7rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-family: monospace;
}
.badge-gold { background: rgba(201,169,89,0.15); color: var(--gold-dark); border: 1px solid rgba(201,169,89,0.3); }
.badge-green { background: rgba(40,167,69,0.1); color: #1A4D32; border: 1px solid rgba(40,167,69,0.3); }

/* PDF Frame */
.pdf-frame-wrapper {
    width: 100%;
    height: 70vh;
    min-height: 500px;
    background: #f4f4f4;
    position: relative;
}
.pdf-frame-wrapper iframe {
    width: 100%; height: 100%; border: none; display: block;
}

/* Bottom Action Bar */
.doc-actions {
    background: #fff;
    padding: 16px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    border-top: 1px solid #eee;
}
.doc-actions .btn { width: auto; padding: 12px 24px; margin: 0; }
.btn-outline {
    background: transparent; color: var(--green-dark); border: 2px solid rgba(11,43,27,0.2);
}
.btn-outline:hover { background: rgba(11,43,27,0.05); }

/* Mobile */
@media (max-width: 768px) {
    .top-header { flex-direction: column; text-align: center; gap: 10px; }
    .brand-logos { flex-direction: column; gap: 5px; }
    .brand-logos img { height: 30px; }
    .doc-info-bar { flex-direction: column; align-items: flex-start; }
    .pdf-frame-wrapper { height: 60vh; min-height: 400px; }
    .doc-actions { flex-direction: column; }
    .doc-actions .btn { width: 100%; }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="scenery-bg"></div>
<div class="scenery-overlay"></div>
<div class="petals-container" id="petalsContainer"></div>

<!-- LOADER -->
<div class="loader-screen" id="loader">
    <div class="tick-loader">
        <div class="tick-icon"><i class="fas fa-check"></i></div>
    </div>
    <div class="loader-text" id="loaderText">Verifying Authenticity</div>
    <div class="loader-sub" id="loaderSub">Connecting to Pekin-Pak secure ledger</div>
</div>

<!-- MAIN CONTAINER -->
<div class="main-container" id="mainContainer">
  
  <!-- SEARCH CARD (Initially Visible) -->
  <div class="search-card" id="searchCard">
    <div class="seal-icon"><i class="fas fa-fingerprint"></i></div>
    <h1>Verify Document</h1>
    <div class="subtitle">Enter Serial Number to Access</div>

    <div class="message-box error" id="errorMsg"></div>

    <div class="input-group">
      <i class="fas fa-barcode"></i>
      <input type="text" id="serialInput" placeholder="e.g. 7893094" autocomplete="off">
    </div>

    <button class="btn btn-gold" id="searchBtn" onclick="searchDocument()">
      <i class="fas fa-search"></i> Find Document
    </button>
  </div>

  <!-- NEW UNIQUE VIEWER (Hidden Initially) -->
  <div class="viewer-wrapper" id="viewerContainer">
    
    <!-- Custom Top Header (Dark Green & Gold) -->
    <header class="top-header">
        <div class="brand-logos">
            <img src="logo-main.png" alt="Logo Left">
            <div>
                <h2>PEKIN-PAK INTERNATIONAL</h2>
                <p>Secure Document Portal</p>
            </div>
            <img src="logo-short.png" alt="Logo Right">
        </div>
    </header>

    <!-- Floating Document Window -->
    <div class="doc-window">
        
        <!-- Info Bar -->
        <div class="doc-info-bar">
            <div class="doc-info-left">
                <i class="fas fa-file-pdf"></i>
                <span id="v-file">document.pdf</span>
            </div>
            <div class="doc-badges">
                <span class="badge badge-gold">Serial: <span id="v-serial">—</span></span>
                <span class="badge badge-green"><i class="fas fa-check-circle"></i> <span id="v-type">—</span></span>
            </div>
        </div>

        <!-- PDF Viewer -->
        <div class="pdf-frame-wrapper">
            <iframe id="doc-frame" src="about:blank"></iframe>
        </div>

        <!-- Actions -->
        <div class="doc-actions">
            <button class="btn btn-outline" onclick="resetSearch()">
                <i class="fas fa-redo"></i> Search Again
            </button>
            <button class="btn btn-gold" onclick="downloadDoc()">
                <i class="fas fa-download"></i> Download PDF
            </button>
        </div>

    </div>
  </div>

</div>

<script>
// ============================================================
// 🔴 AAPKA GOOGLE APPS SCRIPT URL
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwL-DeivRSjmLMM5gpvGJ5DKuwyVRdCM0sE_NQ95VhuZMlxbHRrrT2532iDw4RN7wry1Q/exec";
const FILE_BASE = "letters/";

// ============================================================
// BACKGROUND ANIMATION
// ============================================================
const container = document.getElementById('petalsContainer');
for (let i = 0; i < 20; i++) {
    const petal = document.createElement('div');
    petal.classList.add('petal');
    const size = Math.random() * 10 + 5;
    petal.style.width = `${size}px`;
    petal.style.height = `${size}px`;
    petal.style.left = `${Math.random() * 100}vw`;
    petal.style.animationDuration = `${Math.random() * 10 + 10}s`;
    petal.style.animationDelay = `${Math.random() * 10}s`;
    container.appendChild(petal);
}

// ============================================================
// SEARCH FUNCTION
// ============================================================
async function searchDocument() {
  const input = document.getElementById('serialInput').value.trim();
  const btn = document.getElementById('searchBtn');
  const errorMsg = document.getElementById('errorMsg');
  const searchCard = document.getElementById('searchCard');
  const viewerWrapper = document.getElementById('viewerContainer');
  const loader = document.getElementById('loader');
  const lText = document.getElementById('loaderText');
  const lSub = document.getElementById('loaderSub');

  if (!input) {
    errorMsg.innerText = "⚠️ Please enter a serial number.";
    errorMsg.style.display = 'block';
    return;
  }

  errorMsg.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';

  loader.classList.add('active');
  let step = 0;
  const steps = [
      { t: "Verifying Authenticity", s: "Connecting to Pekin-Pak secure ledger..." },
      { t: "Decrypting Record", s: "Matching cryptographic signatures..." },
      { t: "Access Granted", s: "Loading secure document..." }
  ];
  
  const interval = setInterval(() => {
      if (step < steps.length) {
          lText.innerText = steps[step].t;
          lSub.innerText = steps[step].s;
          step++;
      }
  }, 1200);

  try {
    const res = await fetch(`${API_URL}?serial=${encodeURIComponent(input)}`);
    const data = await res.json();

    // Thoda wait taake loader acha lage
    await new Promise(resolve => setTimeout(resolve, 3500));
    clearInterval(interval);

    if (data.success) {
      searchCard.style.display = 'none';
      viewerWrapper.style.display = 'flex';

      document.getElementById('v-file').innerText = data.file;
      document.getElementById('v-serial').innerText = data.serial;
      document.getElementById('v-type').innerText = formatType(data.type);
      document.getElementById('doc-frame').src = FILE_BASE + data.file;

      loader.classList.remove('active');
    } else {
      loader.classList.remove('active');
      errorMsg.innerText = `❌ No document found for serial: "${input}".`;
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    clearInterval(interval);
    loader.classList.remove('active');
    errorMsg.innerText = "⚠️ Connection error. Check internet and try again.";
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-search"></i> Find Document';
  }
}

// ============================================================
// HELPERS
// ============================================================
function formatType(t) {
  if (!t) return 'Document';
  return t.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function downloadDoc() {
  const file = document.getElementById('v-file').innerText;
  if (!file) return;
  const link = document.createElement('a');
  link.href = FILE_BASE + file;
  link.download = file;
  link.click();
}

function resetSearch() {
  document.getElementById('viewerContainer').style.display = 'none';
  document.getElementById('searchCard').style.display = 'block';
  document.getElementById('doc-frame').src = 'about:blank';
  document.getElementById('serialInput').value = '';
  document.getElementById('errorMsg').style.display = 'none';
}

document.getElementById('serialInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') searchDocument();
});
</script>

</body>
</html>
